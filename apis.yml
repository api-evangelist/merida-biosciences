description: 'Merida Biosciences is a Cambridge, Massachusetts biopharmaceutical company developing
  precision immunology therapies for autoimmune and allergic disorders. The company targets the
  pathogenic drivers of antibody-driven diseases with the goal of durable clinical responses while
  minimizing the side effects of current non-specific autoimmune treatments. Launched in 2025 with
  $121 million in funding and backed by GV, Merida operates as a preclinical therapeutics company
  with a science-and-pipeline website and no public developer, API, or technical product surface.'
